; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = nano33ble


[env]
platform = nordicnrf52
framework=arduino
  


[env:feather_bluefruit_sense]
build_src_filter = +<main.cpp>
board = adafruit_feather_nrf52840_sense
build_flags = -D FEATHER_SENSE
; Pinned for the same reason as the nano33ble environment below. Adafruit BusIO is not
; listed: it comes in as a dependency of Adafruit LSM6DS, which pins it itself.
lib_deps =
  adafruit/Adafruit Unified Sensor @ 1.1.15
  adafruit/Adafruit LSM6DS @ 4.7.4
  khoih-prog/nRF52_PWM @ 1.0.1
upload_protocol = nrfutil
monitor_speed = 9600



; Shared by the two nano33ble environments below, which differ only by the source file
; they build. A pin repeated in two places is a pin that ends up updated in only one.
[nano33ble_base]
board = nano33ble
build_flags = -D NANO_33_BLE
; Pinned exactly, not with ^ ranges: checking out a release tag has to give back the
; firmware that was released. ArduinoBLE especially - BLE_Init relies on setLocalName()
; writing into the scan response rather than the advertising packet, which is what leaves
; room for a 29-character name next to the 128-bit service UUID. A caret range would let
; that behaviour change under us.
; NanoBLEFlashPrefs tag v1.2.0 is commit 59e7ea9, should the tag ever move.
lib_deps =
  arduino-libraries/Servo @ 1.2.2
  arduino-libraries/Arduino_BMI270_BMM150 @ 1.2.1
  arduino-libraries/ArduinoBLE @ 1.4.1
  https://github.com/Dirk-/NanoBLEFlashPrefs.git#v1.2.0
monitor_speed = 9600

[env:nano33ble]
extends = nano33ble_base
build_src_filter = +<main.cpp>

[env:nano33ble-test_imu]
extends = nano33ble_base
build_src_filter = +<test_imu.cpp>